# The theme's CI: build the demo site with every component (the build fails on
# a broken internal link), run `pulzar-docs init` and build the site it
# writes against this commit's theme, and publish the demo to GitHub Pages
# from main.

name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  demo:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Build the demo site
        run: npm run build
      - name: Edit links open files that exist
        run: |
          grep -rhoE 'href="https://github.com/pulzar-net/docs-theme/edit/main/[^"]+"' demo/dist \
            | sed -E 's|.*/edit/main/||; s|"$||' | sort -u > "$RUNNER_TEMP/edit-links"
          test -s "$RUNNER_TEMP/edit-links"
          while read -r f; do
            test -f "$f" || { echo "::error::edit link to a missing file: $f"; exit 1; }
          done < "$RUNNER_TEMP/edit-links"
      - uses: actions/upload-pages-artifact@v5
        with:
          path: demo/dist

  starter:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: init writes a site, and the site builds with this commit's theme
        run: |
          set -euo pipefail
          site="$(mktemp -d)"
          node bin/pulzar-docs.mjs init --project starter-check --description "A site from the starter." --dir "${site}"
          cd "${site}/docs"
          # As a git dependency is installed: packed, with its own dependencies.
          pack="$(mktemp -d)"
          (cd "${GITHUB_WORKSPACE}" && npm pack --silent --pack-destination "${pack}")
          tarball="$(ls "${pack}"/*.tgz)"
          npm pkg set "dependencies.@pulzar-net/docs-theme=file:${tarball}"
          npm install --no-audit --no-fund
          npm run build
          test -f dist/getting-started.html
          if node "${GITHUB_WORKSPACE}/bin/pulzar-docs.mjs" init --project x --description y --dir "${site}"; then
            echo "init overwrote existing files" >&2; exit 1
          fi

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [demo, starter]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
