version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm:
        patterns: ['*']
  - package-ecosystem: github-actions
    # The starter's workflow too, so a new site starts on current actions.
    directories: ['/', '/starter']
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
